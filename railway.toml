# Railway service configuration — build the backend image from the repository root.
# Deploy with `railway up` (CLI) or connect the repo and set this as the service config.
# Docs: https://docs.railway.com/reference/railway-toml
[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
